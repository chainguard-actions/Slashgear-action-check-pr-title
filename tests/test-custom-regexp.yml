name: Test custom regexp input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          regexp: "^(feat|fix|chore|docs|style|refactor|test|ci)(\\(.+\\))?: .+"
      - name: Assert action fails gracefully with custom regexp on non-pull_request event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when not triggered by pull_request event (custom regexp accepted)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for non-pull_request event"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
